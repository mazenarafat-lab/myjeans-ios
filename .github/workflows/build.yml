name: Build iOS App

on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
        # Find the first scheme that isn't Pods
        SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 10 "Schemes:" | grep -v "Pods" | sed -n '2p' | xargs)
        
        echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"
        
        # We add -derivedDataPath build to force the output location
        xcodebuild build \
          -workspace "$WORKSPACE" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          COMPILER_INDEX_STORE_ENABLE=NO | tail -n 50

    - name: Package IPA for Firebase
      run: |
        # 1. Search in the forced build directory
        echo "Searching forced build directory..."
        REAL_APP_PATH=$(find build -name "*.app" -type d | head -1)

        if [ -z "$REAL_APP_PATH" ]; then 
          echo "ERROR: App bundle still not found! Printing build folder content:"
          ls -R build
          exit 1
        fi
        
        echo "Found App at: $REAL_APP_PATH"
        
        # 2. Inject Plist
        cp MyJeansApp/GoogleService-Info.plist "$REAL_APP_PATH/"
        
        # 3. Create Payload for IPA
        mkdir -p Payload
        cp -RL "$REAL_APP_PATH" Payload/
        
        # 4. Standardize name for Firebase
        mv Payload/*.app Payload/MyJeansApp.app
        
        zip -r MyJeansApp.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-IPA
        path: MyJeansApp.ipa
        retention-days: 5
