name: Build iOS App
on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod repo add-cdn trunk https://cdn.cocoapods.org/
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
        </dict>
        </plist>
        EOF

    - name: Archive App (The Professional Way)
      run: |
        xcodebuild archive \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -configuration Debug \
          -archivePath build/MyJeansApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Extract and Zip App
      run: |
        # In an archive, the .app is ALWAYS in this specific sub-folder
        APP_PATH="build/MyJeansApp.xcarchive/Products/Applications/MyJeansApp.app"
        
        echo "Extracting app from archive..."
        mkdir -p final_output
        cp -RL "$APP_PATH" final_output/
        
        cd final_output && zip -r ../MyJeansApp-Simulator.zip MyJeansApp.app

    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-Simulator
        path: MyJeansApp-Simulator.zip
        retention-days: 7