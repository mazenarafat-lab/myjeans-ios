name: Build iOS App
on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod repo add-cdn trunk https://cdn.cocoapods.org/
        pod install --repo-update

    - name: Ensure Directory and Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        # Build without forcing a path - let Xcode use its default cache
        xcodebuild build \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tail -50

    - name: Package App (Deep Scan)
      run: |
        echo "Searching the entire server for the app bundle..."
        # This finds the real .app folder anywhere in the system-wide build cache
        REAL_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Debug-iphonesimulator" | head -1)
        
        if [ -z "$REAL_APP_PATH" ]; then
          echo "ERROR: Could not find any .app bundle in Xcode cache!"
          exit 1
        fi
        
        echo "Found App at: $REAL_APP_PATH"
        mkdir -p final_payload
        
        # Copy the actual folder (dereferencing symlinks)
        cp -RL "$REAL_APP_PATH" final_payload/
        
        # Rename it to a standard name for the zip
        mv final_payload/*.app final_payload/MyJeansApp.app
        
        cd final_payload && zip -r ../MyJeansApp-Simulator.zip MyJeansApp.app

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-Simulator
        path: MyJeansApp-Simulator.zip
        retention-days: 5