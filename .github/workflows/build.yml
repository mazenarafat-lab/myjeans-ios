name: Build iOS App

on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
        # We add 'clean' to fix asset errors and 'COMPILER_INDEX_STORE_ENABLE=NO' for speed
        xcodebuild clean build \
          -workspace "$WORKSPACE" \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO | tail -n 50

    - name: Package for App Distribution
      run: |
        rm -rf Payload MyJeansApp.zip
        APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -1)
        cp MyJeansApp/GoogleService-Info.plist "$APP_PATH/"
        zip -r MyJeansApp.zip "$APP_PATH"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-SIM
        path: MyJeansApp.zip
