name: Build iOS App

on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        set -o pipefail

        xcodebuild build \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Debug \
          -derivedDataPath build_output \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          || exit 1

    - name: Locate App
      run: |
        echo "Searching for .app bundle..."
        find build_output -name "*.app"

    - name: Package App
      run: |
        APP_PATH=$(find build_output -name "*.app" | head -1)

        if [ -z "$APP_PATH" ]; then
          echo "ERROR: No .app found!"
          exit 1
        fi

        echo "Found app at: $APP_PATH"

        mkdir Payload
        cp -R "$APP_PATH" Payload/

        cd Payload
        zip -r ../MyJeansApp-Simulator.zip .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-Simulator
        path: MyJeansApp-Simulator.zip
        retention-days: 5