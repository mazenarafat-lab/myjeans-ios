name: Build iOS App

on:
  push:
    # This matches your current branch name
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        xcodebuild build \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package IPA for Firebase
      run: |
        # 1. Find the .app folder anywhere in the build results
        APP_PATH=$(find . -name "*.app" -type d | grep "Debug" | head -1)
        
        if [ -z "$APP_PATH" ]; then 
          echo "ERROR: App bundle not found! Printing directory tree for help:"
          find . -maxdepth 3 -type d
          exit 1
        fi
        
        echo "Found App at: $APP_PATH"
        
        # 2. Inject your Firebase config into the app
        cp MyJeansApp/GoogleService-Info.plist "$APP_PATH/"
        
        # 3. Create the Payload folder structure required by Firebase
        mkdir -p Payload
        cp -RL "$APP_PATH" Payload/
        
        # 4. Zip it into an .ipa file
        zip -r MyJeansApp.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-IPA
        path: MyJeansApp.ipa
        retention-days: 5
