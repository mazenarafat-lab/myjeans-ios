name: Build iOS App

on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
        xcodebuild clean build \
          -workspace "$WORKSPACE" \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Create REAL .ipa file
      run: |
        # 1. Clear old files
        rm -rf Payload MyJeansApp.ipa
        
        # 2. Find the actual .app bundle (looking specifically in the Products folder)
        APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "MyJeansApp.app" -type d | head -1)
        
        # 3. Safety check: Fail if the app folder is empty or missing
        if [ -z "$APP_PATH" ]; then echo "Error: App bundle not found!"; exit 1; fi
        
        # 4. Inject the Plist
        cp MyJeansApp/GoogleService-Info.plist "$APP_PATH/"
        
        # 5. Package as IPA
        mkdir Payload
        cp -Rp "$APP_PATH" Payload/
        zip -r MyJeansApp.ipa Payload
        
        # 6. Final check: Ensure the IPA isn't tiny
        FILESIZE=$(stat -f%z "MyJeansApp.ipa")
        echo "Final IPA size: $FILESIZE bytes"
        if [ $FILESIZE -lt 100000 ]; then echo "Error: IPA is too small!"; exit 1; fi

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-IPA
        path: MyJeansApp.ipa
