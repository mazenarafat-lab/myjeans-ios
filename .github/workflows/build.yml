name: Build iOS App

on:
  push:
    branches: [ "903693b" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Build for Generic iOS Device
      run: |
        WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
        
        # Using CODE_SIGN_IDENTITY="-" performs an ad-hoc signature 
        # which allows Firebase to recognize it as a valid bundle.
        xcodebuild build \
          -workspace "$WORKSPACE" \
          -scheme MyJeansApp \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="-" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES | tail -n 50

    - name: Package IPA for Firebase
      run: |
        rm -rf Payload MyJeansApp.ipa
        
        # 1. Find the bundle
        REAL_APP_PATH=$(find build/Build/Products/Debug-iphoneos -name "*.app" -type d | head -1)
        echo "Found App at: $REAL_APP_PATH"
        
        if [ -z "$REAL_APP_PATH" ]; then
          echo "ERROR: Physical device build not found!"
          exit 1
        fi
        
        # 2. Inject Plist
        cp MyJeansApp/GoogleService-Info.plist "$REAL_APP_PATH/"
        
        # 3. Create Payload and Copy
        mkdir Payload
        cp -Rp "$REAL_APP_PATH" Payload/
        
        # 4. Remove unnecessary Mac metadata that causes 'Invalid Bundle'
        find Payload -name ".DS_Store" -delete
        
        # 5. Zip it
        zip -r MyJeansApp.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-IPA
        path: MyJeansApp.ipa
        retention-days: 5
