name: Build iOS App

on:
  push:
    # CHANGE "main" to your branch name (e.g., "init" or "master")
    branches: [ "main" ] 
  # This line allows you to click "Run workflow" manually in the GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Create GoogleService-Info.plist from Secrets
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        xcodebuild build \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tail -50

    - name: Package App for Firebase Test Lab (IPA Format)
      run: |
        echo "Searching for the app bundle..."
        REAL_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Debug-iphonesimulator" | head -1)

        if [ -z "$REAL_APP_PATH" ]; then
          echo "ERROR: Could not find any .app bundle!"
          exit 1
        fi

        # 1. Inject the plist into the bundle
        cp MyJeansApp/GoogleService-Info.plist "$REAL_APP_PATH/"

        # 2. Create the 'Payload' directory structure required for IPA files
        mkdir -p Payload
        
        # 3. Copy the app bundle into the Payload folder
        cp -RL "$REAL_APP_PATH" Payload/
        
        # 4. Rename the bundle inside Payload if it's not named correctly
        APP_NAME=$(basename "$REAL_APP_PATH")
        if [ "$APP_NAME" != "MyJeansApp.app" ]; then
          mv "Payload/$APP_NAME" Payload/MyJeansApp.app
        fi

        # 5. Zip the Payload folder and name it .ipa for Firebase Uploader
        zip -r MyJeansApp.ipa Payload

    - name: Upload IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-Firebase-Ready
        path: MyJeansApp.ipa
        retention-days: 5
