name: Build iOS App
on:
  push:
    branches: [ "init" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --repo-update

    - name: Ensure Directory and Create GoogleService-Info.plist
      run: |
        mkdir -p MyJeansApp
        cat > MyJeansApp/GoogleService-Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.myjeans.app</string>
            <key>PROJECT_ID</key>
            <string>myjeans-app-v3</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_GOOGLE_APP_ID }}</string>
            <key>IS_ADS_ENABLED</key>
            <false></false>
            <key>IS_ANALYTICS_ENABLED</key>
            <false></false>
            <key>IS_APPINVITE_ENABLED</key>
            <true></true>
            <key>IS_GCM_ENABLED</key>
            <true></true>
            <key>IS_SIGNIN_ENABLED</key>
            <true></true>
        </dict>
        </plist>
        EOF

    - name: Build for Simulator
      run: |
        xcodebuild build \
          -workspace MyJeansApp.xcworkspace \
          -scheme MyJeansApp \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | tail -50

    - name: Package App and Inject Plist
      run: |
        echo "Searching for the app bundle..."
        REAL_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Debug-iphonesimulator" | head -1)

        if [ -z "$REAL_APP_PATH" ]; then
          echo "ERROR: Could not find any .app bundle!"
          exit 1
        fi

        # INJECTION STEP: Force the plist into the app bundle manually
        echo "Injecting GoogleService-Info.plist into $REAL_APP_PATH"
        cp MyJeansApp/GoogleService-Info.plist "$REAL_APP_PATH/"

        mkdir -p final_payload
        cp -RL "$REAL_APP_PATH" final_payload/
        
        APP_NAME=$(basename "$REAL_APP_PATH")
        if [ "$APP_NAME" != "MyJeansApp.app" ]; then
          mv "final_payload/$APP_NAME" final_payload/MyJeansApp.app
        fi

        cd final_payload && zip -r ../MyJeansApp-Simulator.zip MyJeansApp.app

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MyJeansApp-Simulator
        path: MyJeansApp-Simulator.zip
        retention-days: 5
